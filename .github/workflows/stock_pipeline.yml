on:
  schedule:
    # Runs automatically from Monday to Friday at 9:00 PM UTC (after US markets close)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Allows you to run it manually with one click

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance duckdb pandas

    - name: Run Stock Pipeline Script
      run: python pipeline.py

    - name: Commit and Push Database Changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add stock_warehouse.db
        git commit -m "data: automatic stock warehouse update" || echo "No changes to commit"
        git push